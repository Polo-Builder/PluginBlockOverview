<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoWeb</title>
  <link rel="stylesheet" href="styles.css">
  <script src="../../build/src/shared/translations.js"></script>
  <script type="module" src="../../build/src/popup/popup.js"></script>
  <script type="module" src="../../build/src/shared/kofi.js"></script>
</head>
<body>
  <main>
    <header>
      <h1><img src="../../assets/icons/eco-web-rounded.png" width="28" height="28" alt=""> EcoWeb</h1>
      <label class="toggle">
        <span id="mode">…</span>
        <input id="enabled" type="checkbox" role="switch" data-i18n-label="enableExtension" disabled>
      </label>
    </header>

    <section class="feature" aria-labelledby="block-title">
      <label class="toggle">
        <h2 id="block-title" data-i18n="blockTitle"></h2>
        <input id="block-ai" type="checkbox" role="switch" aria-labelledby="block-title" disabled>
      </label>
      <p data-i18n="blockDescription"></p>
    </section>

    <section class="feature" aria-labelledby="tabs-title">
      <label class="toggle">
        <h2 id="tabs-title" data-i18n="tabsTitle"></h2>
        <input id="eco-tab" type="checkbox" role="switch" aria-labelledby="tabs-title" disabled>
      </label>
      <p data-i18n="tabsDescription"></p>
    </section>
    
    <section class="feature" aria-labelledby="cookies-title">
      <label class="toggle">
        <h2 id="cookies-title" data-i18n="cookiesTitle"></h2>
        <input id="auto-deny-cookies" type="checkbox" role="switch" aria-labelledby="cookies-title" disabled>
      </label>
      <p data-i18n="cookiesDescription"></p>
    </section>

    <section class="eco" aria-labelledby="eco-title">
      <div class="eco-heading">
        <h2 id="eco-title" data-i18n="settingsTitle"></h2>
        <span id="eco-done" role="status" data-i18n="settingsDone" hidden></span>
      </div>
      <p data-i18n="settingsDescription"></p>
      <div class="actions">
        <button id="eco" data-i18n="apply" disabled></button>
        <button id="restore" class="secondary" data-i18n="restore" disabled></button>
      </div>
    </section>

    <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
    <footer class="support">
      <button id="kofi-button" type="button" aria-expanded="false" aria-controls="kofi-panel">
        <img src="../../assets/icons/kofi.png" width="30" height="24" alt="">
        <span data-i18n="support"></span>
      </button>
      <p data-i18n="supportDescription"></p>
    </footer>
    <section id="kofi-panel" class="kofi-panel" aria-label="Ko-fi" hidden>
      <div class="kofi-heading">
        <a href="https://ko-fi.com/polobuilder" target="_blank" rel="noopener noreferrer">ko-fi.com/polobuilder</a>
        <button id="kofi-close" type="button" data-i18n-label="closeSupport">×</button>
      </div>
      <iframe id="kofiframe" data-src="https://ko-fi.com/polobuilder/?hidefeed=true&amp;widget=true&amp;embed=true&amp;preview=true" height="712" title="polobuilder"></iframe>
    </section>
  </main>
</body>
</html>
